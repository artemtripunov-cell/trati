<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Общие траты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== ВНЕШНИЙ ВИД: меняй цвета и шрифт здесь ===== */
/* Идея: светлая пастельная палитра, много воздуха, почти без рамок */
:root {
  --bg: #faf9fd;
  --surface: #ffffff;
  --ink: #2b2838;
  --muted: #77728a;
  --line: #efecf6;
  --field: #f5f3fa;
  --accent: #7a67d9;
  --accent-ink: #6552c9;
  --accent-soft: #f0ecfc;
  --mint: #e4f5ec;  --mint-ink: #2b7a59;
  --peach: #fdeee6; --peach-ink: #b0532d;
  --font: "Manrope", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 980px; margin: 0 auto; padding: 32px 20px 88px; }
h1 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 14px; }
.head { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.who { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
.top { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tab { font: inherit; font-weight: 600; border: 0; background: transparent; color: var(--muted); padding: 8px 16px; border-radius: 999px; cursor: pointer; transition: background .15s, color .15s; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent-ink); }
.seg { display: inline-flex; background: var(--field); border-radius: 14px; padding: 4px; gap: 2px; }
.seg button { font: inherit; font-weight: 600; border: 0; background: transparent; color: var(--muted); padding: 7px 18px; border-radius: 10px; cursor: pointer; transition: background .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent-ink); box-shadow: 0 1px 3px rgba(43,40,56,.08); }
.grid { display: grid; gap: 20px; grid-template-columns: minmax(0,1fr); }
@media (min-width: 900px) { .grid { grid-template-columns: minmax(0,1fr) minmax(0,1fr); align-items: start; } }
.col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 24px; box-shadow: 0 1px 2px rgba(43,40,56,.03); }
input, select, button { font: inherit; color: var(--ink); }
input[type="text"], input[type="email"], input[type="password"], input[type="number"], input[type="date"], select {
  width: 100%; padding: 11px 14px; border: 1px solid transparent; border-radius: 12px; background: var(--field); min-width: 0; transition: border-color .15s, background .15s, box-shadow .15s;
}
input::placeholder { color: #a9a5b8; }
input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus, input[type="number"]:focus, input[type="date"]:focus, select:focus {
  outline: none; background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
}
input[type="file"] { width: 100%; font-size: 13px; color: var(--muted); }
input[type="file"]::file-selector-button { font: inherit; font-weight: 600; font-size: 13px; border: 0; background: var(--accent-soft); color: var(--accent-ink); padding: 7px 14px; border-radius: 10px; margin-right: 12px; cursor: pointer; }
input[type="file"]::file-selector-button:hover { background: #e7e1fa; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { border: 0; background: var(--accent); color: #fff; font-weight: 600; padding: 11px 18px; border-radius: 12px; cursor: pointer; transition: background .15s; }
.btn:hover { background: var(--accent-ink); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: var(--accent-soft); color: var(--accent-ink); }
.btn.ghost:hover { background: #e7e1fa; }
.btn.small { padding: 7px 14px; font-size: 13px; }
.icon-btn { border: 0; background: transparent; color: #a9a5b8; cursor: pointer; padding: 4px 8px; border-radius: 8px; font-size: 15px; }
.icon-btn:hover { background: var(--accent-soft); color: var(--accent-ink); }
label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
.note { font-size: 13px; color: var(--muted); margin: 12px 0 0; }
.warn { background: var(--peach); color: var(--peach-ink); padding: 10px 14px; border-radius: 12px; font-size: 13px; margin-top: 10px; }
.foot { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.stack { display: grid; gap: 14px; }

.auth { max-width: 400px; margin: 64px auto 0; }
.auth h1 { font-size: 26px; margin-bottom: 6px; }
.auth p { color: var(--muted); margin: 0 0 22px; }
.msg { border-radius: 12px; padding: 10px 14px; font-size: 13px; background: var(--peach); color: var(--peach-ink); }
.msg.ok { background: var(--mint); color: var(--mint-ink); }
.linkbtn { border: 0; background: transparent; color: var(--accent-ink); font-weight: 600; cursor: pointer; padding: 0; }

.person { display: grid; grid-template-columns: minmax(0,1fr) 88px 32px; gap: 8px; align-items: center; margin-bottom: 10px; }
.person .pct { display: flex; align-items: center; gap: 6px; }
.person .pct span { color: var(--muted); }
.bar { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--line); margin: 4px 0 18px; gap: 2px; }
.bar i { display: block; height: 100%; transition: width .2s; }
.slider { width: 100%; accent-color: var(--accent); margin: 4px 0 16px; }
.code { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--field); border-radius: 14px; padding: 12px 14px; margin-top: 18px; }
.code b { font-family: Consolas, "Courier New", monospace; letter-spacing: .06em; overflow-wrap: anywhere; }
.code span { color: var(--muted); font-size: 12px; }

.form { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
.form .full { grid-column: 1 / -1; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; background: var(--field); border-radius: 999px; padding: 5px 8px 5px 12px; font-size: 13px; font-weight: 600; }
.chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.chip button { border: 0; background: transparent; color: #a9a5b8; cursor: pointer; padding: 0 4px; font-size: 13px; }
.chip button:hover { color: var(--accent-ink); }
.inline { display: flex; gap: 8px; margin-top: 14px; }

.total { font-size: 38px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.total small { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: 0; display: block; margin-bottom: 4px; }
.scroll { overflow-x: auto; }
.rows { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; margin-top: 16px; }
.rows th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px 10px 8px 0; white-space: nowrap; }
.rows th:not(:first-child), .rows td:not(:first-child) { text-align: right; }
.rows td { padding: 11px 10px 11px 0; border-top: 1px solid var(--line); }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.pill.plus { background: var(--mint); color: var(--mint-ink); }
.pill.minus { background: var(--peach); color: var(--peach-ink); }
.pill.zero { background: var(--accent-soft); color: var(--accent-ink); }
.settle { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
.settle div { background: var(--accent-soft); color: var(--accent-ink); border-radius: 14px; padding: 12px 16px; font-weight: 600; }
.settle .even { background: var(--mint); color: var(--mint-ink); }

.exp { display: grid; grid-template-columns: minmax(0,1fr) auto 32px; gap: 10px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
.exp:first-of-type { border-top: 0; padding-top: 4px; }
.exp .t { font-weight: 600; overflow-wrap: anywhere; }
.exp .m { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 2px; }
.exp .a { font-weight: 700; font-variant-numeric: tabular-nums; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; background: var(--field); border-radius: 999px; padding: 1px 10px; color: var(--ink); }
.tag i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.thumb { border: 0; background: var(--field); border-radius: 8px; padding: 0; cursor: pointer; width: 30px; height: 30px; overflow: hidden; color: var(--muted); font-size: 14px; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.empty { color: var(--muted); text-align: center; padding: 22px 0; }

.mbar { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 20px; }
.mbar strong { min-width: 170px; text-align: center; font-size: 17px; font-weight: 700; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 20px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px 20px; box-shadow: 0 1px 2px rgba(43,40,56,.03); }
.tile small { color: var(--muted); font-size: 12px; font-weight: 600; display: block; }
.tile b { font-size: 24px; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; display: block; margin: 4px 0 6px; }
.summary { background: var(--accent-soft); color: var(--ink); border-radius: 18px; padding: 16px 20px; margin-bottom: 20px; }
.chartbox { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; justify-content: center; }
.legend { display: flex; flex-direction: column; gap: 8px; font-size: 14px; min-width: 190px; }
.legend div { display: flex; align-items: center; gap: 10px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.legend span { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
svg text { fill: var(--muted); font-family: var(--font); }
svg .val { fill: var(--ink); font-weight: 700; }
.barrect { fill: #e8e2fa; }
.barrect.sel { fill: var(--accent); }

#lightbox { position: fixed; inset: 0; background: rgba(43,40,56,.6); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
#lightbox.open { display: flex; }
#lightbox img { max-width: 100%; max-height: 100%; border-radius: 16px; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 14px; font-size: 14px; display: none; z-index: 11; max-width: 90%; box-shadow: 0 6px 24px rgba(43,40,56,.18); }
@media (prefers-reduced-motion: reduce) { .bar i, .tab, .seg button, .btn { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div id="bootMsg" class="card" style="margin-top:40px">Загрузка…</div>

  <!-- Экран входа -->
  <div id="authView" class="auth" hidden>
    <h1>Общие траты</h1>
    <p id="authLead">Войдите, чтобы вести общие траты.</p>
    <form class="card stack" id="authForm">
      <div><label for="aEmail">Почта</label><input type="email" id="aEmail" autocomplete="email" required></div>
      <div><label for="aPass">Пароль (минимум 6 символов)</label><input type="password" id="aPass" autocomplete="current-password" minlength="6" required></div>
      <button class="btn" type="submit" id="aSubmit">Войти</button>
      <div id="authMsg" class="msg" hidden></div>
      <div class="note" id="authSwitch"></div>
    </form>
  </div>

  <!-- Основное приложение -->
  <div id="appView" hidden>
    <div class="head">
      <h1>Общие траты</h1>
      <div class="who"><span id="whoEmail"></span><button class="btn ghost small" id="signOut">Выйти</button></div>
    </div>
    <div class="top">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="seg" id="viewSwitch"></div>
    </div>
    <section class="card" id="groupTools" hidden></section>
    <div id="viewMain" class="grid"></div>
    <div id="viewStats" hidden></div>
  </div>
</div>
<div id="lightbox" role="dialog" aria-label="Чек"><img alt="Чек"></div>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.97.0/dist/umd/supabase.js"></script>
<script>
(function () {
  "use strict";

  /* ===== ПОДКЛЮЧЕНИЕ К БАЗЕ (публичные значения, их можно хранить в файле) ===== */
  var SUPABASE_URL = "https://mvsuxcqjqzdmewrpluwb.supabase.co";
  var SUPABASE_KEY = "sb_publishable_rbYvtQM1Ya0zZBmdvvQWXQ_TiDqoqCX";

  /* ===== КАТЕГОРИИ НОВЫХ ГРУПП ===== */
  var DEFAULT_CATS = ["Продукты", "Одежда", "Транспорт", "Жильё", "Рестораны", "Развлечения", "Здоровье", "Другое"];
  var PALETTE = ["#a99be8", "#8fd3b6", "#f4b59b", "#8dbbea", "#eba6c8", "#e6d68a", "#bba8d6", "#a3b8b0", "#f3c98a", "#88cbd8"];
  var MONTHS = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
  var MONTHS_GEN = ["январе","феврале","марте","апреле","мае","июне","июле","августе","сентябре","октябре","ноябре","декабре"];
  var MONTHS_SHORT = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  var fmt = new Intl.NumberFormat("ru-RU", { style: "currency", currency: "EUR" });
  function money(n) { return fmt.format(Math.round(n * 100) / 100); }
  function r2(n) { return Math.round(n * 100) / 100; }
  function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function today() { return iso(new Date()); }
  function mkey(date) { return String(date).slice(0, 7); }
  function shiftMonth(k, n) { return iso(new Date(+k.slice(0, 4), +k.slice(5, 7) - 1 + n, 1)).slice(0, 7); }
  function mlabel(k) { var m = MONTHS[+k.slice(5, 7) - 1]; return m.charAt(0).toUpperCase() + m.slice(1) + " " + k.slice(0, 4); }
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) { var r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16); });
  }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var toastTimer;
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.style.display = "block";
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.style.display = "none"; }, 4500);
  }
  function fail(e, what) { console.error(e); toast(what + (e && e.message ? " (" + e.message + ")" : "")); }

  if (!window.supabase || !window.supabase.createClient) {
    $("bootMsg").textContent = "Не удалось загрузить библиотеку для связи с базой. Проверьте интернет и обновите страницу.";
    return;
  }
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  /* ===== состояние ===== */
  var S = { user: null, groups: [], gid: null, members: [], expenses: [], urls: {}, urlsAt: 0, view: "main", month: today().slice(0, 7), showTools: false, authMode: "in" };
  var lastLocal = 0, dirty = {}, saveTimer, refreshTimer, channel = null, pollTimer = null;

  /* ===== вспомогательное представление текущей группы ===== */
  function L() {
    var g = S.groups.filter(function (x) { return x.id === S.gid; })[0];
    if (!g) return null;
    return {
      id: g.id, name: g.name, code: g.invite_code, categories: g.categories || DEFAULT_CATS.slice(), createdBy: g.created_by,
      people: S.members,
      expenses: S.expenses.map(function (e) {
        return { id: e.id, desc: e.description, amount: Number(e.amount), payer: e.payer_id, date: e.spent_on, cat: e.category, path: e.receipt_path, receipt: e.receipt_path ? (S.urls[e.receipt_path] || null) : null };
      })
    };
  }
  function catColor(l, name) { var i = l.categories.indexOf(name); return i < 0 ? "#b8b4c4" : PALETTE[i % PALETTE.length]; }

  function calc(l) {
    var sum = l.people.reduce(function (s, p) { return s + (Number(p.pct) || 0); }, 0);
    var total = l.expenses.reduce(function (s, x) { return s + x.amount; }, 0);
    var rows = l.people.map(function (p) {
      var paid = l.expenses.filter(function (x) { return x.payer === p.id; }).reduce(function (s, x) { return s + x.amount; }, 0);
      var share = sum > 0 ? total * (Number(p.pct) || 0) / sum : 0;
      return { p: p, paid: paid, share: share, bal: paid - share };
    });
    var cred = rows.filter(function (r) { return r.bal > 0.005; }).map(function (r) { return { n: r.p.name, v: r.bal }; }).sort(function (a, b) { return b.v - a.v; });
    var debt = rows.filter(function (r) { return r.bal < -0.005; }).map(function (r) { return { n: r.p.name, v: -r.bal }; }).sort(function (a, b) { return b.v - a.v; });
    var moves = [], i = 0, j = 0;
    while (i < debt.length && j < cred.length) {
      var x = Math.min(debt[i].v, cred[j].v);
      if (x > 0.005) moves.push({ from: debt[i].n, to: cred[j].n, v: x });
      debt[i].v -= x; cred[j].v -= x;
      if (debt[i].v < 0.005) i++;
      if (cred[j].v < 0.005) j++;
    }
    return { sum: sum, total: total, rows: rows, moves: moves };
  }

  /* ===================== ВХОД ===================== */
  function showAuth() {
    $("bootMsg").hidden = true; $("appView").hidden = true; $("authView").hidden = false;
    var up = S.authMode === "up";
    $("authLead").textContent = up ? "Создайте аккаунт. Он нужен, чтобы ваши группы видели только вы и ваши участники." : "Войдите, чтобы вести общие траты.";
    $("aSubmit").textContent = up ? "Создать аккаунт" : "Войти";
    $("aPass").autocomplete = up ? "new-password" : "current-password";
    $("authSwitch").innerHTML = up ? 'Уже есть аккаунт? <button type="button" class="linkbtn" data-auth="in">Войти</button>' : 'Нет аккаунта? <button type="button" class="linkbtn" data-auth="up">Создать</button>';
  }
  function authMsg(text, ok) { var m = $("authMsg"); m.hidden = !text; m.textContent = text || ""; m.className = "msg" + (ok ? " ok" : ""); }
  function authError(e) {
    var m = (e && e.message) || "";
    if (/Invalid login credentials/i.test(m)) return "Неверная почта или пароль.";
    if (/already registered|already been registered/i.test(m)) return "Эта почта уже зарегистрирована. Нажмите «Войти».";
    if (/Password should be/i.test(m)) return "Пароль слишком простой или короткий (минимум 6 символов).";
    if (/rate limit/i.test(m)) return "Слишком много попыток. Подождите немного и повторите.";
    if (/valid email|invalid format/i.test(m)) return "Проверьте адрес почты.";
    if (/Email not confirmed/i.test(m)) return "Почта не подтверждена. В настройках Supabase нужно выключить Confirm email.";
    return "Не получилось: " + m;
  }

  async function onSignedIn(user) {
    S.user = user;
    $("authView").hidden = true; $("bootMsg").hidden = true; $("appView").hidden = false;
    $("whoEmail").textContent = user.email || "";
    await loadGroups(lsGet("ot-gid"));
    startLive();
  }
  function onSignedOut() {
    stopLive();
    S.user = null; S.groups = []; S.gid = null; S.members = []; S.expenses = []; S.urls = {};
    showAuth();
  }

  /* ===================== ДАННЫЕ ===================== */
  async function loadGroups(preferId) {
    var r = await sb.from("groups").select("id,name,invite_code,categories,created_by,created_at").order("created_at", { ascending: true });
    if (r.error) { fail(r.error, "Не удалось загрузить группы"); return; }
    S.groups = r.data || [];
    var pick = S.groups.filter(function (g) { return g.id === (preferId || S.gid); })[0] || S.groups[0];
    S.gid = pick ? pick.id : null;
    S.showTools = !S.gid;
    if (S.gid) { lsSet("ot-gid", S.gid); await loadGroupData(); }
    else { S.members = []; S.expenses = []; renderAll(); }
  }
  async function loadGroupData() {
    var gid = S.gid; if (!gid) return;
    var res = await Promise.all([
      sb.from("members").select("id,name,pct,created_at").eq("group_id", gid).order("created_at", { ascending: true }),
      sb.from("expenses").select("id,payer_id,description,amount,category,spent_on,receipt_path,created_at").eq("group_id", gid).order("spent_on", { ascending: false }).order("created_at", { ascending: false })
    ]);
    if (gid !== S.gid) return;
    if (res[0].error || res[1].error) { fail(res[0].error || res[1].error, "Не удалось загрузить траты"); return; }
    S.members = (res[0].data || []).map(function (m) { return { id: m.id, name: m.name, pct: Number(m.pct) }; });
    S.expenses = res[1].data || [];
    await loadUrls();
    renderAll();
  }
  async function loadUrls() {
    if (Date.now() - S.urlsAt > 45 * 60 * 1000) { S.urls = {}; S.urlsAt = Date.now(); }
    var need = S.expenses.map(function (e) { return e.receipt_path; }).filter(function (p) { return p && !S.urls[p]; });
    if (!need.length) return;
    try {
      var r = await sb.storage.from("receipts").createSignedUrls(need, 3600);
      (r.data || []).forEach(function (d) { if (d.signedUrl) S.urls[d.path] = d.signedUrl; });
    } catch (e) { console.error(e); }
  }

  /* Обновление «вживую»: когда кто-то из участников записал трату */
  function startLive() {
    stopLive();
    try {
      channel = sb.channel("live-changes")
        .on("postgres_changes", { event: "*", schema: "public", table: "expenses" }, scheduleRefresh)
        .on("postgres_changes", { event: "*", schema: "public", table: "members" }, scheduleRefresh)
        .subscribe();
    } catch (e) { console.error(e); }
    pollTimer = setInterval(function () { if (!document.hidden && S.user) scheduleRefresh(); }, 30000);
  }
  function stopLive() {
    if (channel) { try { sb.removeChannel(channel); } catch (e) {} channel = null; }
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }
  function scheduleRefresh() {
    if (Date.now() - lastLocal < 1500) return;
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(softRefresh, 500);
  }
  async function softRefresh() {
    if (!S.user || !S.gid) return;
    var ae = document.activeElement;
    var typing = ae && /INPUT|SELECT|TEXTAREA/.test(ae.tagName) && $("viewMain").contains(ae);
    if (typing || Object.keys(dirty).length) return;
    await loadGroupData();
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden && S.user) scheduleRefresh(); });

  /* ---------- статистика ---------- */
  function monthTotals(l, k) {
    var by = {}, total = 0;
    l.expenses.forEach(function (x) { if (mkey(x.date) === k) { var c = x.cat || "Другое"; by[c] = (by[c] || 0) + x.amount; total += x.amount; } });
    return { by: by, total: total };
  }
  function pctChange(now, prev) { return prev > 0 ? (now - prev) / prev * 100 : null; }
  function changePill(now, prev) {
    var ch = pctChange(now, prev);
    if (ch === null) return '<span class="pill zero">новое</span>';
    if (Math.abs(ch) < 0.5) return '<span class="pill zero">без изменений</span>';
    var up = ch > 0;
    return '<span class="pill ' + (up ? "minus" : "plus") + '">' + (up ? "▲ +" : "▼ ") + Math.round(ch) + "%</span>";
  }
  function barChart(l, k) {
    var ks = []; for (var i = 5; i >= 0; i--) ks.push(shiftMonth(k, -i));
    var vals = ks.map(function (m) { return monthTotals(l, m).total; });
    var mx = Math.max.apply(null, vals.concat([1]));
    var W = 420, H = 210, padB = 28, padT = 22, bw = 44, gap = (W - bw * 6) / 7;
    var svg = '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" style="max-width:460px" role="img" aria-label="Траты по месяцам">';
    ks.forEach(function (m, i) {
      var h = (H - padB - padT) * vals[i] / mx, x = gap + i * (bw + gap), y = H - padB - h;
      svg += '<rect class="barrect' + (m === k ? " sel" : "") + '" x="' + x + '" y="' + y + '" width="' + bw + '" height="' + Math.max(h, 2) + '" rx="8"></rect>';
      svg += '<text class="val" x="' + (x + bw / 2) + '" y="' + (y - 6) + '" text-anchor="middle" font-size="11">' + (vals[i] ? Math.round(vals[i]) : "") + "</text>";
      svg += '<text x="' + (x + bw / 2) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="12">' + MONTHS_SHORT[+m.slice(5, 7) - 1] + "</text>";
    });
    return svg + "</svg>";
  }
  function donut(l, by, total) {
    var R = 46, C = 2 * Math.PI * R, off = 0;
    var names = Object.keys(by).sort(function (a, b) { return by[b] - by[a]; });
    var svg = '<svg viewBox="0 0 140 140" width="170" height="170" role="img" aria-label="Распределение трат по категориям"><circle cx="70" cy="70" r="' + R + '" fill="none" stroke="var(--line)" stroke-width="20"></circle>';
    names.forEach(function (n) {
      var len = C * by[n] / total, seg = Math.max(len - 1.5, 0.5);
      svg += '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="' + catColor(l, n) + '" stroke-width="20" stroke-dasharray="' + seg + " " + (C - seg) + '" stroke-dashoffset="' + (-off) + '" transform="rotate(-90 70 70)"></circle>';
      off += len;
    });
    svg += '<text x="70" y="67" text-anchor="middle" font-size="11">Всего</text><text class="val" x="70" y="84" text-anchor="middle" font-size="15">' + Math.round(total) + " €</text></svg>";
    return { svg: svg, names: names };
  }
  function renderStats() {
    var l = L(); if (!l) { $("viewStats").innerHTML = ""; return; }
    var k = S.month, pk = shiftMonth(k, -1);
    var cm = monthTotals(l, k), pm = monthTotals(l, pk);
    var isCurrent = k >= today().slice(0, 7);
    var h = '<div class="mbar"><button class="btn ghost small" data-month="-1" aria-label="Предыдущий месяц">‹</button><strong>' + mlabel(k) + '</strong><button class="btn ghost small" data-month="1" aria-label="Следующий месяц"' + (isCurrent ? " disabled" : "") + ">›</button></div>";
    if (!cm.total) {
      h += '<section class="card"><div class="empty">В этом месяце трат нет. Выберите другой месяц или добавьте траты.</div></section>';
      $("viewStats").innerHTML = h; return;
    }
    var ch = pctChange(cm.total, pm.total);
    var names = Object.keys(cm.by).sort(function (a, b) { return cm.by[b] - cm.by[a]; });
    var top = names[0], topShare = Math.round(cm.by[top] / cm.total * 100);
    var mn = MONTHS_GEN[+k.slice(5, 7) - 1], pn = MONTHS[+pk.slice(5, 7) - 1];
    var sentence = "В " + mn + " потрачено " + money(cm.total) + ". ";
    if (ch === null) sentence += "За предыдущий месяц данных нет, сравнить пока не с чем. ";
    else if (Math.abs(ch) < 0.5) sentence += "Это столько же, сколько в предыдущем месяце (" + pn + "). ";
    else sentence += "Это на " + Math.abs(Math.round(ch)) + "% " + (ch > 0 ? "больше" : "меньше") + ", чем в предыдущем месяце (" + pn + "). ";
    sentence += "Больше всего ушло на категорию «" + top + "»: " + topShare + "% всех трат.";
    h += '<div class="summary">' + esc(sentence) + "</div>";
    h += '<div class="tiles"><div class="tile"><small>Этот месяц</small><b>' + money(cm.total) + "</b>" + changePill(cm.total, pm.total) + '</div><div class="tile"><small>Прошлый месяц</small><b>' + money(pm.total) + '</b></div><div class="tile"><small>Записей в месяце</small><b>' + l.expenses.filter(function (x) { return mkey(x.date) === k; }).length + "</b></div></div>";
    var dn = donut(l, cm.by, cm.total);
    h += '<div class="grid"><section class="card"><h2>Траты по месяцам (€)</h2><div class="chartbox">' + barChart(l, k) + '</div></section>';
    h += '<section class="card"><h2>На что ушли деньги</h2><div class="chartbox">' + dn.svg + '<div class="legend">' + dn.names.map(function (n) {
      return '<div><i style="background:' + catColor(l, n) + '"></i>' + esc(n) + "<span>" + Math.round(cm.by[n] / cm.total * 100) + "%</span></div>";
    }).join("") + "</div></div></section></div>";
    var allCats = Object.keys(Object.assign({}, cm.by, pm.by)).sort(function (a, b) { return (cm.by[b] || 0) - (cm.by[a] || 0); });
    h += '<section class="card" style="margin-top:16px"><h2>Сравнение с предыдущим месяцем</h2><div class="scroll"><table class="rows"><thead><tr><th>Категория</th><th>' + MONTHS_SHORT[+pk.slice(5, 7) - 1] + "</th><th>" + MONTHS_SHORT[+k.slice(5, 7) - 1] + "</th><th>Доля</th><th>Изменение</th></tr></thead><tbody>";
    allCats.forEach(function (n) {
      var a = cm.by[n] || 0, b = pm.by[n] || 0;
      h += '<tr><td><span class="tag"><i style="background:' + catColor(l, n) + '"></i>' + esc(n) + "</span></td><td>" + (b ? money(b) : "—") + "</td><td>" + (a ? money(a) : "—") + "</td><td>" + (a ? Math.round(a / cm.total * 100) + "%" : "—") + "</td><td>" + (a ? changePill(a, b) : '<span class="pill plus">▼ −100%</span>') + "</td></tr>";
    });
    h += "</tbody></table></div></section>";
    $("viewStats").innerHTML = h;
  }

  /* ===================== ДЕЙСТВИЯ ===================== */
  function compress(file) {
    return new Promise(function (resolve) {
      var fr = new FileReader();
      fr.onerror = function () { resolve(null); };
      fr.onload = function () {
        var img = new Image();
        img.onerror = function () { resolve(null); };
        img.onload = function () {
          var max = 900, s = Math.min(1, max / Math.max(img.width, img.height));
          var c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          c.toBlob(function (b) { resolve(b); }, "image/jpeg", 0.65);
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  function scheduleSaveMembers() {
    lastLocal = Date.now();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async function () {
      var ids = Object.keys(dirty); dirty = {};
      try {
        for (var i = 0; i < ids.length; i++) {
          var m = S.members.filter(function (q) { return q.id === ids[i]; })[0]; if (!m) continue;
          var r = await sb.from("members").update({ name: m.name, pct: m.pct }).eq("id", m.id);
          if (r.error) throw r.error;
        }
        lastLocal = Date.now();
      } catch (e) { fail(e, "Не удалось сохранить"); loadGroupData(); }
    }, 600);
  }

  async function createGroup(name) {
    var r = await sb.from("groups").insert({ name: name, categories: DEFAULT_CATS }).select("id").single();
    if (r.error) { fail(r.error, "Не удалось создать группу"); return; }
    var me = ((S.user && S.user.email) || "Я").split("@")[0];
    var m = await sb.from("members").insert([{ group_id: r.data.id, name: me, pct: 50 }, { group_id: r.data.id, name: "Участник 2", pct: 50 }]);
    if (m.error) fail(m.error, "Группа создана, но участников добавить не удалось");
    S.showTools = false;
    await loadGroups(r.data.id);
    toast("Группа создана. Переименуйте участников и задайте проценты.");
  }
  async function joinGroup(code) {
    var r = await sb.rpc("join_group", { code: code.trim() });
    if (r.error) { toast(/invalid code/i.test(r.error.message || "") ? "Такой код не найден." : "Не удалось вступить: " + (r.error.message || "")); return; }
    S.showTools = false;
    await loadGroups(r.data);
    toast("Вы вступили в группу.");
  }

  /* ===================== СОБЫТИЯ ===================== */
  document.addEventListener("click", async function (e) {
    var lb = $("lightbox");
    if (lb.classList.contains("open")) { lb.classList.remove("open"); return; }
    var t = e.target.closest("button"); if (!t) return;
    if (t.dataset.auth) { S.authMode = t.dataset.auth; authMsg(""); showAuth(); return; }
    if (!S.user) return;
    var l = L();
    if (t.id === "signOut") { await sb.auth.signOut(); return; }
    if (t.dataset.tools) { S.showTools = !S.showTools; renderTop(); return; }
    if (t.dataset.tab) { S.gid = t.dataset.tab; S.showTools = false; lsSet("ot-gid", S.gid); S.members = []; S.expenses = []; renderAll(); await loadGroupData(); return; }
    if (t.dataset.view) { S.view = t.dataset.view; renderAll(); return; }
    if (!l) return;
    if (t.dataset.month) { var nk = shiftMonth(S.month, +t.dataset.month); if (nk > today().slice(0, 7)) return; S.month = nk; renderStats(); return; }
    if (t.dataset.rc) { var x = l.expenses.filter(function (q) { return q.id === t.dataset.rc; })[0]; if (x && x.receipt) { lb.querySelector("img").src = x.receipt; lb.classList.add("open"); } return; }
    if (t.dataset.delx) {
      var ex = S.expenses.filter(function (q) { return q.id === t.dataset.delx; })[0];
      lastLocal = Date.now();
      var d = await sb.from("expenses").delete().eq("id", t.dataset.delx);
      if (d.error) { fail(d.error, "Не удалось удалить"); return; }
      if (ex && ex.receipt_path) { try { await sb.storage.from("receipts").remove([ex.receipt_path]); } catch (er) {} }
      S.expenses = S.expenses.filter(function (q) { return q.id !== t.dataset.delx; });
      renderResultsHistory(); return;
    }
    if (t.dataset.delcat) {
      var cats = l.categories.slice(); cats.splice(+t.dataset.delcat, 1); if (!cats.length) cats = ["Другое"];
      lastLocal = Date.now();
      var u = await sb.from("groups").update({ categories: cats }).eq("id", l.id);
      if (u.error) { fail(u.error, "Не удалось сохранить категории"); return; }
      S.groups.forEach(function (g) { if (g.id === l.id) g.categories = cats; });
      renderMain(); return;
    }
    if (t.dataset.delp) {
      if (l.people.length <= 2) return;
      if (t.dataset.sure !== "1") { t.dataset.sure = "1"; t.textContent = "Удалить?"; t.title = "Вместе с его тратами. Нажмите ещё раз"; return; }
      lastLocal = Date.now();
      var dp = await sb.from("members").delete().eq("id", t.dataset.delp);
      if (dp.error) { fail(dp.error, "Не удалось удалить участника"); return; }
      await loadGroupData(); return;
    }
    if (t.id === "addPerson") {
      lastLocal = Date.now();
      var ap = await sb.from("members").insert({ group_id: l.id, name: "Участник " + (l.people.length + 1), pct: 0 });
      if (ap.error) { fail(ap.error, "Не удалось добавить участника"); return; }
      await loadGroupData(); return;
    }
    if (t.id === "evenOut") {
      var n = l.people.length, base = Math.floor(100 / n), rest = 100 - base * n;
      S.members.forEach(function (p, i) { p.pct = base + (i < rest ? 1 : 0); dirty[p.id] = true; });
      renderMain(); scheduleSaveMembers(); return;
    }
    if (t.id === "copyCode") {
      try { navigator.clipboard.writeText(l.code).then(function () { t.textContent = "Скопировано"; }, function () { t.textContent = "Не удалось"; }); } catch (er) { t.textContent = "Не удалось"; }
      return;
    }
    if (t.id === "leaveGroup") {
      var mine = l.createdBy === S.user.id;
      if (t.dataset.sure !== "1") { t.dataset.sure = "1"; t.textContent = mine ? "Точно удалить для всех? Нажмите ещё раз" : "Точно покинуть? Нажмите ещё раз"; return; }
      var rr = mine ? await sb.from("groups").delete().eq("id", l.id) : await sb.from("group_users").delete().eq("group_id", l.id).eq("user_id", S.user.id);
      if (rr.error) { fail(rr.error, "Не получилось"); return; }
      S.gid = null; await loadGroups(); return;
    }
    if (t.id === "copyBtn") {
      var c = calc(l);
      var txt = l.name + "\nВсего: " + money(c.total) + "\n" + c.rows.map(function (r) { return r.p.name + " (" + r.p.pct + "%): заплатил " + money(r.paid) + ", доля " + money(r.share); }).join("\n") + "\n" + (c.moves.length ? c.moves.map(function (m) { return m.from + " → " + m.to + ": " + money(m.v); }).join("\n") : "Все в расчёте");
      try { navigator.clipboard.writeText(txt).then(function () { t.textContent = "Скопировано"; }, function () { t.textContent = "Не удалось скопировать"; }); } catch (er) { t.textContent = "Не удалось скопировать"; }
    }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") $("lightbox").classList.remove("open"); });

  document.addEventListener("submit", async function (e) {
    e.preventDefault();
    var id = e.target.id;
    if (id === "authForm") {
      var email = $("aEmail").value.trim(), pass = $("aPass").value, btn = $("aSubmit");
      btn.disabled = true; authMsg("");
      try {
        if (S.authMode === "up") {
          var su = await sb.auth.signUp({ email: email, password: pass });
          if (su.error) authMsg(authError(su.error));
          else if (!su.data.session) authMsg("Аккаунт создан, но Supabase ждёт подтверждения почты. Выключите Confirm email в настройках проекта и войдите.", false);
        } else {
          var si = await sb.auth.signInWithPassword({ email: email, password: pass });
          if (si.error) authMsg(authError(si.error));
        }
      } catch (er) { authMsg("Нет связи с сервером. Проверьте интернет."); }
      btn.disabled = false; return;
    }
    if (!S.user) return;
    var l = L();
    if (id === "newGroupForm") { var nm = $("ngName").value.trim(); if (nm) await createGroup(nm); return; }
    if (id === "joinForm") { var cd = $("jCode").value.trim(); if (cd) await joinGroup(cd); return; }
    if (!l) return;
    if (id === "catForm") {
      var cn = $("newCat").value.trim();
      if (!cn || l.categories.indexOf(cn) >= 0) return;
      var cats = l.categories.concat([cn]);
      lastLocal = Date.now();
      var u = await sb.from("groups").update({ categories: cats }).eq("id", l.id);
      if (u.error) { fail(u.error, "Не удалось сохранить категорию"); return; }
      S.groups.forEach(function (g) { if (g.id === l.id) g.categories = cats; });
      renderMain(); return;
    }
    if (id === "expForm") {
      var desc = $("fDesc").value.trim(), amt = parseFloat(String($("fAmt").value).replace(",", "."));
      if (!desc || !(amt > 0)) return;
      var payer = $("fPayer").value, sub = $("fSubmit");
      sub.disabled = true; sub.textContent = "Записываю…";
      lastLocal = Date.now();
      try {
        var path = null, f = $("fFile").files[0];
        if (f) {
          var blob = await compress(f);
          if (!blob) toast("Не удалось прочитать фото. Трата записана без чека.");
          else {
            path = l.id + "/" + uuid() + ".jpg";
            var up = await sb.storage.from("receipts").upload(path, blob, { contentType: "image/jpeg" });
            if (up.error) { toast("Чек не загрузился (" + up.error.message + "). Трата записана без чека."); path = null; }
          }
        }
        var ins = await sb.from("expenses").insert({ group_id: l.id, payer_id: payer, description: desc, amount: r2(amt), category: $("fCat").value, spent_on: $("fDate").value || today(), receipt_path: path });
        if (ins.error) throw ins.error;
        lsSet("ot-payer-" + l.id, payer);
        lastLocal = Date.now();
        await loadGroupData();
        toast("Записано: " + desc + ", " + money(r2(amt)));
        if (window.innerWidth < 900) $("results").scrollIntoView({ behavior: "smooth", block: "start" });
        else { var fd = $("fDesc"); if (fd) fd.focus(); }
      } catch (er) {
        fail(er, "Трата не записалась");
        var s2 = $("fSubmit"); if (s2) { s2.disabled = false; s2.textContent = "Записать"; }
      }
    }
  });

  document.addEventListener("input", function (e) {
    var t = e.target, l = L(); if (!l || !S.user) return;
    if (t.id === "slider") {
      var v = parseInt(t.value, 10);
      S.members[0].pct = v; S.members[1].pct = 100 - v; dirty[S.members[0].id] = true; dirty[S.members[1].id] = true;
      var ins = document.querySelectorAll("[data-pct]"); ins[0].value = S.members[0].pct; ins[1].value = S.members[1].pct;
      paintBar(); $("results").innerHTML = resultsHTML(L()); scheduleSaveMembers(); return;
    }
    if (t.dataset.pct) {
      var val = Math.max(0, Math.min(100, parseInt(t.value, 10) || 0));
      var p = S.members.filter(function (q) { return q.id === t.dataset.pct; })[0]; if (!p) return;
      p.pct = val; dirty[p.id] = true;
      if (S.members.length === 2) {
        var other = S.members[0] === p ? S.members[1] : S.members[0]; other.pct = 100 - val; dirty[other.id] = true;
        var i2 = document.querySelectorAll("[data-pct]"); i2[0].value = S.members[0].pct; i2[1].value = S.members[1].pct;
        var sl = $("slider"); if (sl) sl.value = S.members[0].pct;
      }
      paintBar(); $("results").innerHTML = resultsHTML(L()); scheduleSaveMembers();
    }
  });
  document.addEventListener("change", function (e) {
    var t = e.target, l = L(); if (!l || !S.user) return;
    if (t.dataset.name) {
      var p = S.members.filter(function (q) { return q.id === t.dataset.name; })[0]; if (!p) return;
      p.name = t.value.trim() || p.name; dirty[p.id] = true;
      $("addform").innerHTML = formHTML(L()); renderResultsHistory(); scheduleSaveMembers();
    }
  });

  /* ===================== ЗАПУСК ===================== */
  sb.auth.onAuthStateChange(function (event, session) {
    // отложенный вызов, чтобы не блокировать внутренности библиотеки
    setTimeout(function () {
      if (session && session.user) { if (!S.user || S.user.id !== session.user.id) onSignedIn(session.user); }
      else if (S.user || event === "SIGNED_OUT") onSignedOut();
    }, 0);
  });
  sb.auth.getSession().then(function (r) {
    var s = r && r.data && r.data.session;
    if (s && s.user) { if (!S.user) onSignedIn(s.user); }
    else if (!S.user) showAuth();
  }).catch(function () { showAuth(); });
})();
</script>
</body>
</html>
